# Baseline workstation ruleset. Dynamic rules managed by the scripts live in
# /etc/pf.anchors/dotfiles.conf.

set block-policy return
set skip on lo0
scrub in all fragment reassemble

nat-anchor "dotfiles"
rdr-anchor "dotfiles"

block in all
pass out all keep state

# Permit diagnostics and the ICMPv6 control traffic required for IPv6 to work.
pass in inet proto icmp from any to self icmp-type echoreq keep state
pass in inet6 proto ipv6-icmp from any to self keep state

anchor "dotfiles"
load anchor "dotfiles" from "/etc/pf.anchors/dotfiles.conf"
